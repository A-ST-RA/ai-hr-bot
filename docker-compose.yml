version: "3.8"

services:
    postgres:
        image: postgres:15-alpine
        container_name: ai-hr-bot-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DATABASE_NAME:-strapi}
            POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "${DATABASE_PORT:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi}"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - app-network

    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ai-hr-bot-app
        restart: unless-stopped
        environment:
            # Server
            HOST: ${HOST:-0.0.0.0}
            PORT: ${PORT:-1337}
            APP_KEYS: ${APP_KEYS}
            NODE_ENV: ${NODE_ENV:-production}

            # Database
            DATABASE_CLIENT: ${DATABASE_CLIENT:-postgres}
            DATABASE_HOST: ${DATABASE_HOST:-postgres}
            DATABASE_PORT: ${DATABASE_PORT:-5432}
            DATABASE_NAME: ${DATABASE_NAME:-strapi}
            DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
            DATABASE_PASSWORD: ${DATABASE_PASSWORD:-strapi}
            DATABASE_URL: ${DATABASE_URL:-}
            DATABASE_SSL: ${DATABASE_SSL:-false}
            DATABASE_SCHEMA: ${DATABASE_SCHEMA:-public}

            # Avito
            AVITO_CLIENT_ID: ${AVITO_CLIENT_ID}
            AVITO_CLIENT_SECRET: ${AVITO_CLIENT_SECRET}
            AVITO_USER_ID: ${AVITO_USER_ID}

            # DeepSeek
            DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
            DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}

            # Webhook
            WEBHOOK_URL: ${WEBHOOK_URL:-}
        volumes:
            - app_uploads:/app/public/uploads
            - app_data:/app/.tmp
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - app-network

    nginx:
        image: nginx:alpine
        container_name: ai-hr-bot-nginx
        restart: unless-stopped
        ports:
            - "${NGINX_HTTP_PORT:-80}:80"
            - "${NGINX_HTTPS_PORT:-443}:443"
        volumes:
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - ./nginx/ssl:/etc/nginx/ssl:ro
            - nginx_logs:/var/log/nginx
        depends_on:
            - app
        networks:
            - app-network

volumes:
    postgres_data:
    app_uploads:
    app_data:
    nginx_logs:

networks:
    app-network:
        driver: bridge
